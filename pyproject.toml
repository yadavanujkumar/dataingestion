[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "howlplatform"
version = "0.1.0"
description = "HOWL Platform - Automated Multi-Source Marketing Data Ingestion & Reporting Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jsonschema>=4.0.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.21"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]
postgres = [
    "psycopg2-binary>=2.9.0"
]

[project.scripts]
howl = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
